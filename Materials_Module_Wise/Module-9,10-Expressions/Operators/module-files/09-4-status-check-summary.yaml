name: 09-4-Status-Check-Summary 
on: 
    workflow_dispatch: 
jobs:
    status-functions-demo:
        runs-on: ubuntu-latest
        steps:
        - name: Step 1 Runs Normally 
          run: echo "Step 1 Completed Succesfully"
        - name: Step 2 - Fails Intentionally
          run: |
            echo "This step will fail"
            exit 1 
        - name: Step 3 - success()
          if: success()
          run: echo "This will run only if all the previos steps are passed"
        - name: Step 4 - failure - runs because step 2 is failed  
          if: failure()
          run: echo "A previous step is failed , running some cleanup activity"
        - name: Step 5 - always() - always run
          if: always()
          run: echo "This wil always run- perfect for reporting"
    notify-on-failure:
        runs-on: ubuntu-latest
        needs: status-functions-demo
        if: failure()   # job level - only if previos job failed
        steps:
        - name: Send Alert 
          run: |
            echo "Job Failed -  Sending Notification"
            echo "Branch is     : ${{github.ref_name}}"
            echo "Actor  is     : ${{ github.actor}}"
    final-summary: 
        runs-on: ubuntu-latest
        needs: [ status-functions-demo, notify-on-failure]
        if: always()                    # always runs even if above jobs are failed
        steps:
          - name: Write Summary
            run: |
                echo "## Pipeline Summary " >> $GITHUB_STEP_SUMMARY
                echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
                echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
                echo "| status-function-demo | ${{ needs.status-functions-demo.result}} | " >> $GITHUB_STEP_SUMMARY
                echo "| notify-on-failure | ${{ needs.notify-on-failure.result}} | " >> $GITHUB_STEP_SUMMARY

# GITHUB_STEP_SUMMARY
          


