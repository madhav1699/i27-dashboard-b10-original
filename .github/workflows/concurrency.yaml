name: Concurrency Job
on: 
  push:
    branches: [ master ]
concurrency: 
    group: ci-${{ github.ref }} ## branch name 
    cancel-in-progress: true
jobs:
    ci: 
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Setup Java 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: temurin
        - name: Running Maven Tests
          run: mvn test

