name: CI-Promotion-file-Custom-Actions
on:
  workflow_dispatch:
    inputs:
      java-version:
        description: select java version
        type: choice
        options: ['17','21']
        default: '21'

      distribution:
        description: select java distribution
        type: string
        default: 'temurin'

      run-tests:
        description: want to run tests or not?
        type: boolean
        default: true

      environment:
        description: Target Environment
        type: choice
        options:
          - production
          - staging
          - dev
      version:
        description: Version to Deploy?
        type: string
        default: v1.0.0
  push:
    branches:
      - master
    paths:
      - "Dockerfile"
      - "pom.xml"
      - "src/**"
env:
  image_name: madhav2026/i27-dashboard-app

jobs:
  job1:
    name: Code checkout, Build, Artifact, CommitTag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{steps.tag1.outputs.value}}
    steps:
      - name: code-checkout
        uses: actions/checkout@v5

      - name: setup-java
        uses: ./.github/actions/javabuild
        with:
          java-version: ${{inputs.java-version}}
          distribution: ${{inputs.distribution}}
          run-tests: ${{inputs.run-tests}}

      - name: upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: myjarfile
          path: target/*.jar

      - name: creating image tag
        id: tag1
        run: echo "value=${{github.sha}}" >> $GITHUB_OUTPUT

  job2:
    name: Get code, Docker Build, login, Push
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: checkout-code
        uses: actions/checkout@v5

      - name: docker build and push
        uses: ./.github/actions/dockerbuild
        with:
          image_name: ${{env.image_name}}
          image_tag: ${{needs.job1.outputs.image_tag}}
          docker_username: ${{vars.docker_username}}
          docker_password: ${{secrets.docker_password}}

      - name: Docker result summary
        id: result-tag
        run: |
          echo "${{steps.result-tag.outputs.docker_result}}"
      # - name: Docker Build
      #   run: docker build -t ${{env.image_name}}:${{needs.job1.outputs.image_tag}} .
      
      # - name: Docker Login
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{vars.docker_username}}
      #     password: ${{secrets.docker_password}}

      # - name: Docker Push
      #   run: docker push ${{env.image_name}}:${{needs.job1.outputs.image_tag}}

      # - name: Docker Summary
      #   run: |
      #     echo "Docker image name is: ${{env.image_name}}:${{needs.job1.outputs.image_tag}}"

  job3:
    if: ${{inputs.environment == 'dev'}}
    name: dev environment
    runs-on: ubuntu-latest
    needs: [job1, job2]
    environment:
      name: dev
      url: http://mydev.usaa.com
    steps:
      - name: Deploying on dev
        run: |
          echo "Dev deployment is completed successfully!"
  job4:
    if: ${{inputs.environment == 'staging'}}
    name: stage environment
    runs-on: ubuntu-latest
    needs: [job1, job2]
    environment:
      name: staging
      url: http://mystage.usaa.com
    steps:
      - name: Deploying on stage
        run: |
          echo "stage deployment is completed successfully!"

  job5:
    if: ${{inputs.environment == 'production'}}
    name: prod environment
    runs-on: ubuntu-latest
    needs: [job1, job2]
    environment:
      name: production
      url: http://mydprod.usaa.com
    steps:
      - name: Deploying on prod 
        run: |
          echo "prod deployment is completed successfully!"


          