name: CI-Project-practise
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "Dockerfile"
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "Dockerfile"
jobs:
  Build-job:
    name: This job will do codechekout, setup java, maven test and package and uploda artifact
    runs-on: ubuntu-latest

    steps:

      - name: code-checkout
        uses: actions/checkout@v4

      - name: setup-java
        uses: actions/setup-java@v5
        with:
          distributuon: temurin
          java-version: '21'
      - run: java --version

      - name: Code Compile, Test, package
        run: mvn clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jar artifact is uploading 
          path: target/*.jar
          retention-days: 30
