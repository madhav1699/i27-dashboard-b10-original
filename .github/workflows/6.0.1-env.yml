# defining variables at
# workflow level, job level, step level

name: 6.0.1-environmental-variables
on:
  workflow_dispatch:
env:
  user: "madhav"
  owner: "reddy"
jobs:
  envjob0:
    runs-on: ubuntu-latest
    steps:
      - name: env's at workflow level
        run: |
          echo "USer is: $user"
          echo "Owner is: $owner"

  envjob1:
    runs-on: ubuntu-latest
    env:
      app: "Swiggy"
      environment: "Prod"
    steps:
      - name: env's at job level
        run: |
          echo "Application Name is: $app"
          echo "Application deployed at: $environment"

  envjob2:
    runs-on: ubuntu-latest
    steps:
      - name: env's at step level
        env:
          movie: "athadu"
          theator: "sudarshan"
        run: |
          echo "Movie name is: $movie"
          echo "Theator is: $theator"
